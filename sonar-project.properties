sonar.projectKey=poc-agente-estimacion-epicas
sonar.projectName=PoC Agente Estimacion Epicas
sonar.sourceEncoding=UTF-8

# Código fuente a analizar (sin dependencias, build artifacts ni datos).
sonar.sources=backend/app,backend/models,backend/utils,frontend/components,frontend/pages,frontend/styles
sonar.tests=backend/tests,frontend/components/__tests__
sonar.exclusions=**/node_modules/**,**/.next/**,**/venv/**,**/__pycache__/**,**/trained_models/**,**/*.ipynb,**/coverage/**,**/.scannerwork/**,**/__tests__/**

# Reportes de cobertura (generados por scripts/sonar-scan.sh antes del análisis).
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
